<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intro — Caio Cadete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100;200;300&family=Syne:wght@400;700&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05070F;
      width: 100vw;
      height: 100vh;
      overflow-y: hidden;
    }
    body.unlocked {
      overflow-y: scroll;
    }

    /* ── Canvas de fundo ── */
    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      opacity: 0;
      filter: blur(12px);
      transition: opacity 0.9s ease, filter 0.9s ease;
    }
    canvas#bg.visible {
      opacity: 1;
      filter: blur(0px);
    }

    /* scanlines sutis */
    #scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.03) 3px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      filter: blur(12px);
      transition: opacity 0.9s ease, filter 0.9s ease;
    }
    #intro.visible {
      opacity: 1;
      filter: blur(0px);
    }

    .intro-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .name-line {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 100;
      font-size: clamp(80px, 14vw, 160px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 0.9;
      text-align: left;
      position: relative;
      display: block;
    }

    /* We draw fill progress via clip-path on a filled clone */
    .name-wrap {
      position: relative;
      display: block;
      line-height: 0.92;
    }

    /* base layer: stroke only */
    .name-base {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.6);
    }

    /* fill layer: clipped, sits on top */
    .name-fill {
      position: absolute;
      top: 0; left: 0;
      color: rgba(255,255,255,0.92);
      -webkit-text-stroke: 0px transparent;
      /* clip-path updated by JS — starts at 0 width from both sides */
      clip-path: inset(0 100% 0 100%);
      white-space: nowrap;
    }

    /* glitch offset layers */
    .name-ghost {
      position: absolute;
      top: 0; left: 0;
      color: transparent;
      -webkit-text-stroke: 0.5px rgba(255,255,255,0.15);
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    #subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(10px, 1.2vw, 13px);
      font-weight: 300;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255,255,255,0);
      transition: color 0.8s ease;
      margin-top: 28px;
    }

    #subtitle.show { color: rgba(255,255,255,0.35); }

    #wipe { display: none; }

    /* Hero texts fade in after suction */
    .name-corner {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .name-corner.show { opacity: 1; }

    .hero-role, .hero-divider, .hero-body {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .hero-role.show, .hero-divider.show, .hero-body.show { opacity: 1; }

    /* Words are inline with opacity:0 — they take space but are invisible */
    /* This prevents layout shift when they fade in */
    .hero-body .W { display: inline; }

    .suck-letter {
      display: inline-block;
      transform-origin: center center;
      position: relative;
    }
    .suck-letter {
      display: inline-block;
      transform-origin: center center;
      animation: suckLetter var(--suck-dur, 0.6s) var(--suck-delay, 0s)
                 cubic-bezier(0.3, 0, 0.7, 1) forwards;
    }

    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    .name-corner {
      position: absolute;
      top: 28px;
      left: 36px;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.06em;
      z-index: 2;
    }

    .hero-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 640px;
      width: 90%;
      z-index: 2;
      /* Fix layout shift: reserve space for all words upfront */
      min-height: 280px;
    }

    .hero-role {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4D8EFF;
      margin-bottom: 18px;
    }

    .hero-divider {
      width: 32px;
      height: 1px;
      background: #4D8EFF;
      margin-bottom: 24px;
    }

    .hero-body {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      line-height: 2.0;
      color: rgba(255,255,255,0.82);
    }

    .hero-body .W {
      display: inline;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .hero-body .W.show { opacity: 1; }

    /* replay */
    #replay {
      position: fixed;
      bottom: 24px;
      right: 28px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 18px;
      cursor: pointer;
      background: transparent;
      z-index: 100;
      transition: all 0.2s;
    }
    #replay:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }
  
    /* ── SCROLL ENGINE ── */
    #scroll-wrap {
      /* Espaçador que ativa o scroll após o hero */
      height: 600vh;
      position: relative;
    }
    #scroll-canvas {
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
      background: #000;
    }
    #scroll-canvas.show { opacity: 1; }
    #dark-overlay {
      position: fixed;
      inset: 0;
      background: #05070F;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: none;
    }
    #works {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: 10vw;
      opacity: 0;
      pointer-events: none;
      z-index: 11;
      transition: opacity 0.8s ease;
    }
    #works.show { opacity: 1; pointer-events: all; }
    .works-label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4D8EFF;
      margin-bottom: 40px;
    }
    .work-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      max-width: 600px;
    }
    .work-row:first-of-type { border-top: 1px solid rgba(255,255,255,0.08); }
    .work-row.show { opacity: 1; transform: none; }
    .work-row:hover .work-arrow { color: #4D8EFF; transform: translateX(4px); }
    .work-n {
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      width: 20px;
    }
    .work-meta { flex: 1; }
    .work-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 2.8vw, 32px);
      color: #fff;
      letter-spacing: -0.02em;
      display: block;
    }
    .work-sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
    }
    .work-arrow {
      color: rgba(255,255,255,0.15);
      font-size: 18px;
      transition: color 0.3s, transform 0.3s;
    }

    </style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="scanline"></div>

<div id="intro">
  <div class="intro-inner">
    <!-- CAIO -->
    <div class="name-wrap" id="wrap-caio">
      <div class="name-line name-base" id="base-caio">CAIO</div>
      <div class="name-line name-fill" id="fill-caio">CAIO</div>
      <div class="name-line name-ghost" id="ghost-caio">CAIO</div>
    </div>

    <!-- CADETE -->
    <div class="name-wrap" id="wrap-cadete">
      <div class="name-line name-base" id="base-cadete">CADETE</div>
      <div class="name-line name-fill" id="fill-cadete">CADETE</div>
      <div class="name-line name-ghost" id="ghost-cadete">CADETE</div>
    </div>

    <div id="subtitle">Product &amp; Interactive Designer</div>
  </div>
</div>

<div id="wipe"></div>

<div id="hero">
  <div class="name-corner">Caio Cadete</div>
  <div class="hero-content">
    <div class="hero-role">Product &amp; Interactive Designer</div>
    <div class="hero-divider"></div>
    <div class="hero-body" id="hero-body"></div>
  </div>
</div>

<button id="replay" onclick="run()">↺ replay</button>

<script>
// ───────────────────────────────
// CANVAS — Stars + Constellation
// ───────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  initConstellation();
}
window.addEventListener('resize', resize);

// All particles unified — bgStars + constellation all contract together
let allParticles = [];
let cState = 'idle';
let cProgress = 0;
let expandScale = 1;
let constellationAlpha = 1;

function initConstellation() {
  const W = canvas.width, H = canvas.height;
  allParticles = Array.from({length: 175}, (_, i) => {
    const isCon = i < 55;
    const ox = Math.random(), oy = Math.random();
    const angle = Math.atan2(oy - 0.5, ox - 0.5) || Math.random() * Math.PI * 2;
    return {
      ox, oy,
      x: ox * W, y: oy * H,
      ex: Math.cos(angle), ey: Math.sin(angle),
      r:  isCon ? 0.8 + Math.random() * 1.8 : 0.3 + Math.random() * 1.1,
      a:  isCon ? 0.3 + Math.random() * 0.55 : 0.15 + Math.random() * 0.55,
      sp: 0.001 + Math.random() * 0.005,
      ph: Math.random() * Math.PI * 2,
      dx: (Math.random() - 0.5) * 0.0002,
      dy: (Math.random() - 0.5) * 0.0002,
      isCon
    };
  });
}

function drawFrame(ts) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const t = ts * 0.001;

  // — all particles (stars + constellation unified) —
  allParticles.forEach(p => {
    if (cState === 'idle') {
      p.ox = Math.max(0.01, Math.min(0.99, p.ox + p.dx));
      p.oy = Math.max(0.01, Math.min(0.99, p.oy + p.dy));
      p.x = p.ox * W;
      p.y = p.oy * H;
    } else if (cState === 'contracting') {
      // Simple easeInOut — no bounce
    const e = cProgress < 0.5 ? 4*cProgress*cProgress*cProgress : 1 - Math.pow(-2*cProgress+2,3)/2;
      p.x = p.ox * W + (W * 0.5 - p.ox * W) * e;
      p.y = p.oy * H + (H * 0.5 - p.oy * H) * e;
    } else if (cState === 'expanding') {
      const e = expandScale * expandScale;
      p.x += p.ex * Math.max(W, H) * 0.06;
      p.y += p.ey * Math.max(W, H) * 0.06;
    }

    const twinkle = 0.4 + 0.6 * Math.sin(t * p.sp * 60 + p.ph);
    let alpha = p.a * twinkle * constellationAlpha;
    if (cState === 'expanding') alpha *= (1 - expandScale);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, alpha)})`;
    ctx.fill();
  });

  // constellation connection lines
  if (constellationAlpha > 0 && cState !== 'expanding') {
    const cps = allParticles.filter(p => p.isCon);
    const maxDist = W * 0.18;
    for (let i = 0; i < cps.length; i++) {
      for (let j = i+1; j < cps.length; j++) {
        const dx = cps[i].x - cps[j].x;
        const dy = cps[i].y - cps[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < maxDist) {

// progress 0 → 1: clip-path goes from inset(0 50% 0 50%) to inset(0 0% 0 0%)
function setFillProgress(p) {
  const pct = Math.round((1 - p) * 50); // 50% → 0%
  const clip = `inset(0 ${pct}% 0 ${pct}%)`;
  document.getElementById('fill-caio').style.clipPath   = clip;
  document.getElementById('fill-cadete').style.clipPath = clip;
}

const ghosts = [

  document.getElementById('ghost-cadete')
];

function glitchTick(intensity) {
  ghosts.forEach(g => {
    if (Math.random() < intensity * 0.7) {
      const dx = (Math.random()-0.5) * 12 * intensity;
      const dy = (Math.random()-0.5) * 6  * intensity;
      g.style.transform = `translate(${dx}px,${dy}px)`;
      g.style.opacity   = (0.3 + Math.random() * 0.4) * intensity;
    } else {
      g.style.opacity = '0';
    }
  });
}

let timers      = [];
let heroVisible = false;

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

function clearAll() {
  timers.forEach(clearTimeout); timers = [];
  if (glitchIv) { clearInterval(glitchIv); glitchIv = null; }
}

function run() {
  clearAll();
  heroVisible = false;

  // reset DOM
  setFillProgress(0);
  document.getElementById('subtitle').className = '';
  document.getElementById('intro').style.opacity   = '1';
  document.getElementById('intro').style.transform = 'none';
  document.getElementById('intro').style.transition = 'none';
  document.getElementById('hero-body').innerHTML = '';
  const heroEl = document.getElementById('hero');
  heroEl.style.transition = 'none';
  heroEl.style.opacity    = '0';
  heroEl.style.transform  = 'scale(1.3)';
  document.querySelector('.name-corner').classList.remove('show');
  document.querySelector('.hero-role').classList.remove('show');
  document.querySelector('.hero-divider').classList.remove('show');
  document.querySelector('.hero-body').classList.remove('show');
  // Restore fill layers (remove letter spans, restore text and clip-path)
  [['fill-caio','CAIO'],['fill-cadete','CADETE']].forEach(([id, text]) => {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
      el.style.clipPath = '';
    }
  });
  // Restore base/ghost opacity
  document.querySelectorAll('.name-base, .name-ghost').forEach(el => {
    el.style.opacity = '';
  });
  // Reset fade in
  const introEl = document.getElementById('intro');
  const bgEl    = document.getElementById('bg');
  introEl.classList.remove('visible');
  bgEl.classList.remove('visible');
  introEl.style.transition = 'none';
  bgEl.style.transition    = 'none';
  requestAnimationFrame(() => {
    introEl.style.transition = '';
    bgEl.style.transition    = '';
  });
  ghosts.forEach(g => { g.style.opacity='0'; g.style.transform=''; });

  // reset constellation
  cState = 'idle';
  cProgress = 0;
  expandScale = 0;
  constellationAlpha = 1;
  resize();

  // Fade in + unblur on load
  setTimeout(() => {
    document.getElementById('intro').classList.add('visible');
    document.getElementById('bg').classList.add('visible');
  }, 80);

  // — Phase 1: subtitle appears —
  later(() => {
    document.getElementById('subtitle').classList.add('show');
  }, 500);

  // — Phase 2: glitch pulses, then liquid fill begins —
  later(() => {
    let intensity = 0.1;
    glitchIv = setInterval(() => {
      intensity = Math.min(intensity + 0.02, 0.6);
      glitchTick(intensity);
    }, 150);
  }, 900);

  // — Phase 3: fill starts (liquid from both sides) —
  later(() => {
    if (glitchIv) { clearInterval(glitchIv); glitchIv = null; }
    ghosts.forEach(g => g.style.opacity = '0');

    const duration = 1800; // ms to fill completely
    const start    = performance.now();

    function fillStep(now) {
      const p = Math.min((now - start) / duration, 1);
      // ease in-out cubic
      const eased = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
      setFillProgress(eased);
      if (p < 1) {
        requestAnimationFrame(fillStep);
      } else {
        // fill complete — brief pause then constellation event
        setTimeout(() => {
        triggerConstellation();
        revealHero();
      }, 400);
      }
    }
    requestAnimationFrame(fillStep);
  }, 2200);
}

function triggerConstellation() {
  cState    = 'contracting';
  cProgress = 0;

  const hero         = document.getElementById('hero');
  const contractDur  = 900;
  const contractStart = performance.now();

  // Start fading in hero bg immediately as particles contract
  function contractStep(now) {
    cProgress = Math.min((now - contractStart) / contractDur, 1);
    constellationAlpha = 1 - cProgress;

    // hero bg fades in + zooms from 1.3 to 1.0 simultaneously
    const bgOpacity = cProgress * cProgress;
    hero.style.opacity = bgOpacity.toFixed(3);
    const scale = 1.3 - cProgress * 0.3;
    hero.style.transform = `scale(${scale.toFixed(3)})`;

    if (cProgress < 1) {
      requestAnimationFrame(contractStep);
    } else {
      constellationAlpha = 0;
      cState = 'done';
      hero.style.opacity = '1';
      hero.style.transform = 'scale(1)';
    }
  }
  requestAnimationFrame(contractStep);
}

function easeInOut(t) { return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
function easeIn(t)    { return t*t*t; }
function lerp(a,b,t)  { return a + (b-a)*t; }
// Bounce out only
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2);
}
// Bounce in AND out — anticipation at start, overshoot at end
function easeInOutBack(t) {
  const c1 = 1.70158, c2 = c1 * 1.525;
  return t < 0.5
    ? (Math.pow(2*t,2) * ((c2+1)*2*t - c2)) / 2
    : (Math.pow(2*t-2,2) * ((c2+1)*(2*t-2) + c2) + 2) / 2;
}
// Elastic out — springy arrival
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -8*t) * Math.sin((t*10 - 0.75) * (2*Math.PI/3)) + 1;
}

function revealHero() {
  heroVisible = true;

  const subtitleEl = document.getElementById('subtitle');
  const targetX    = 52;
  const targetY    = 32;

  const introEl   = document.querySelector('.name-line');
  const introSize = parseFloat(getComputedStyle(introEl).fontSize);
  const finalSize = 32;
  const suckScale = finalSize / introSize;
  const lineH     = finalSize * 1.1;

  if (subtitleEl) {
    subtitleEl.style.transition = 'opacity 0.35s ease';
    subtitleEl.style.opacity    = '0';
  }

  // Collect all letter animations across both lines
  const allLetters = [];

  document.querySelectorAll('.name-wrap').forEach((wrap, lineIdx) => {
    const base  = wrap.querySelector('.name-base');
    const ghost = wrap.querySelector('.name-ghost');
    if (base)  base.style.opacity  = '0';
    if (ghost) ghost.style.opacity = '0';

    const fill = wrap.querySelector('.name-fill');
    if (!fill) return;

    const text = fill.textContent;
    fill.textContent = '';
    fill.style.clipPath = 'none';

    // Build a hidden clone to measure final positions accurately
    const clone = fill.cloneNode(false);
    clone.style.position   = 'fixed';
    clone.style.left       = targetX + 'px';
    clone.style.top        = (targetY + lineIdx * lineH) + 'px';
    clone.style.fontSize   = finalSize + 'px';
    clone.style.opacity    = '0';
    clone.style.whiteSpace = 'nowrap';
    clone.style.clipPath   = 'none';
    clone.textContent      = text;
    document.body.appendChild(clone);
    void clone.offsetWidth;

    // Create spans in the real fill
    const spans = text.split('').map(ch => {
      const span = document.createElement('span');
      span.textContent   = ch;
      span.style.display = 'inline-block';
      fill.appendChild(span);
      return span;
    });
    void fill.offsetWidth;

    // Measure start positions (in original large font)
    const starts = spans.map(span => {
      const r = span.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2, w: r.width, h: r.height };
    });

    // Measure final positions using clone characters
    const cloneChars = [...clone.childNodes];
    // Actually measure using cursor accumulation at final font size
    // Render clone chars
    clone.textContent = '';
    const cloneSpans = text.split('').map(ch => {
      const sp = document.createElement('span');
      sp.textContent   = ch;
      sp.style.display = 'inline-block';
      clone.appendChild(sp);
      return sp;
    });
    void clone.offsetWidth;

    const ends = cloneSpans.map(sp => {
      const r = sp.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2 };
    });

    document.body.removeChild(clone);

    const total = spans.length;
    spans.forEach((span, i) => {
      // Random chaos params per letter
      const rotDir    = (Math.random() > 0.5 ? 1 : -1);
      const rotAmt    = (90 + Math.random() * 270) * rotDir;
      const chaosDist = 60 + Math.random() * 80;
      const chaosAng  = Math.random() * Math.PI * 2;
      const delay     = (total - 1 - i) * 0.035; // last letter first

      allLetters.push({
        span,
        sx: starts[i].x, sy: starts[i].y,
        ex: ends[i].x,   ey: ends[i].y,
        rotAmt, chaosDist, chaosAng,
        suckScale,
        delay,
        dur: 0.6 + Math.random() * 0.12
      });
    });
  });

  // Animate all letters with rAF
  const startTime = performance.now();

  function animFrame(now) {
    let allDone = true;

    allLetters.forEach(L => {
      const elapsed = (now - startTime) / 1000 - L.delay;
      if (elapsed < 0) { allDone = false; return; }

      const t = Math.min(elapsed / L.dur, 1);
      if (t < 1) allDone = false;

      const te = easeInOutBack(t);

      // Position: bezier through chaos point
      // Control point is offset perpendicular to direct path
      const cpx = (L.sx + L.ex) / 2 + Math.cos(L.chaosAng) * L.chaosDist;
      const cpy = (L.sy + L.ey) / 2 + Math.sin(L.chaosAng) * L.chaosDist;

      // Quadratic bezier
      const bx = (1-te)*(1-te)*L.sx + 2*(1-te)*te*cpx + te*te*L.ex;
      const by = (1-te)*(1-te)*L.sy + 2*(1-te)*te*cpy + te*te*L.ey;

      // Rotation: spins during flight, straight at end
      const rotEase = t < 0.8 ? easeIn(t/0.8) : 1;
      const rot = L.rotAmt * Math.sin(rotEase * Math.PI);

      // Scale with slight bounce
      const scale = lerp(1, L.suckScale, easeInOutBack(t));

      L.span.style.transform = `translate(${bx - L.sx}px, ${by - L.sy}px) rotate(${rot}deg) scale(${scale})`;
    });

    if (!allDone) {
      requestAnimationFrame(animFrame);
    } else {
      // All landed — show hero texts
      setTimeout(() => {
        document.querySelector('.hero-role').classList.add('show');
        document.querySelector('.hero-divider').classList.add('show');
        setTimeout(() => {
          document.querySelector('.hero-body').classList.add('show');
          setTimeout(revealHeroText, 300);
        }, 150);
      }, 100);
    }
  }

  requestAnimationFrame(animFrame);
}

function revealHeroText() {
  const sentence = "I'm a product designer and a musician in my spare time. I enjoy designing interfaces in the same way I compose music, with intention, rhythm, and harmony in every detail.";
  const words    = sentence.split(' ');
  const container = document.getElementById('hero-body');
  container.innerHTML = '';

  const spans = words.map((w, i) => {
    const sp = document.createElement('span');
    sp.className = 'W';
    sp.textContent = w + (i < words.length - 1 ? ' ' : '');
    container.appendChild(sp);
    return sp;
  });

  let i = 0;
  function next() {
    if (i < spans.length) {
      spans[i].classList.add('show');
      i++;
      setTimeout(next, 55 + Math.random() * 35);
    }
  }
  setTimeout(next, 300);
}

  const BASE   = 'https://res.cloudinary.com/dfiyxjf5t/image/upload/f_webp,q_75/';

  const canvas  = document.getElementById('scroll-canvas');
  const ctx     = canvas ? canvas.getContext('2d') : null;
  const overlay = document.getElementById('dark-overlay');
  const works   = document.getElementById('works');

  let active = false;
  let lastIdx = -1;
  const cache = {};

  function url(i) { return BASE + FRAMES[i] + '.png'; }

  function resize() {
    if (!canvas) return;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    if (lastIdx >= 0) draw(lastIdx, true);
  }

  function preload(start, n) {
    for (let i = start; i < Math.min(start + n, TOTAL); i++) {
      if (!cache[i]) {
        const img = new Image(); img.src = url(i); cache[i] = img;
      }
    }
  }

  function draw(idx, force) {
    if (!ctx || (!force && idx === lastIdx)) return;
    lastIdx = idx;
    const img = cache[idx];
    if (!img) {
      const ni = new Image();
      ni.onload = () => draw(idx, true);
      ni.src = url(idx);
      cache[idx] = ni;
      return;
    }
    if (!img.complete || !img.naturalWidth) { img.onload = () => draw(idx, true); return; }
    const cw = canvas.width, ch = canvas.height;
    const s  = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, (cw - img.naturalWidth*s)/2, (ch - img.naturalHeight*s)/2, img.naturalWidth*s, img.naturalHeight*s);
  }

  function onScroll() {
    if (!active) return;
    const wrap    = document.getElementById('scroll-wrap');
    const scrollY = window.scrollY;
    const maxY    = wrap.offsetHeight - window.innerHeight;
    const p       = Math.min(1, scrollY / maxY);

    draw(Math.min(Math.floor(p * TOTAL), TOTAL - 1));
    preload(Math.floor(p * TOTAL), 40);

    // Overlay in last 25%
    const ot = Math.max(0, Math.min(1, (p - 0.7) / 0.25));
    if (overlay) overlay.style.opacity = ot.toFixed(3);

    // Works appear at 85% overlay
    if (works) {
      if (ot > 0.85 && !works.classList.contains('show')) {
        works.classList.add('show');
        document.querySelectorAll('.work-row').forEach((el, i) =>
          setTimeout(() => el.classList.add('show'), i * 100)
        );
      } else if (ot < 0.6 && works.classList.contains('show')) {
        works.classList.remove('show');
        document.querySelectorAll('.work-row').forEach(el => el.classList.remove('show'));
      }
    }
  }

  window.enableScroll = function() {
    active = true;
    resize();
    if (canvas) canvas.classList.add('show');
    preload(0, 80);
    draw(0);
    document.body.classList.add('unlocked');
    window.addEventListener('scroll', onScroll, { passive: true });
  };

  window.addEventListener('resize', resize);
